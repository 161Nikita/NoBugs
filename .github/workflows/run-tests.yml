name: Build, Run Tests and Deploy Reports

on:
  push:
    paths:
      - 'src/**'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Run Automation Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'
          cache: 'maven'

      - name: Permission for maven wrapper
        run: chmod +x mvnw

      - name: Start Infrastructure via Docker Compose
        run: |
          cd infra/docker_compose
          sed -i 's|nobugsme/nbank:preprod_version|nobugsme/nbank:with_validation_fix_with_swagger|g' docker-compose.yml
          docker compose up -d
          sleep 15
          docker compose ps

      - name: Run Tests 5 Times
        run: |
          for i in {1..5}; do
            echo "============================================="
            echo "ЗАПУСК АВТОТЕСТОВ: ИТЕРАЦИЯ №$i"
            echo "============================================="
            ./mvnw clean test -DbaseUrl=http://localhost:4111 -DuiUrl=http://localhost:3000
          done

      - name: Run Swagger coverage CLI
        if: always()
        run: |
          chmod +x .swagger-coverage-commandline/bin/swagger-coverage-commandline
          .swagger-coverage-commandline/bin/swagger-coverage-commandline -s http://localhost:4111/v3/api-docs -i target/swagger-coverage-output

      - name: Install Allure CLI
        if: always()
        run: |
          sudo wget https://github.com
          sudo tar -zxf allure-2.24.1.tgz -C /opt/
          sudo ln -s /opt/allure-2.24.1/bin/allure /usr/bin/allure
          allure --version

      - name: Generate Allure Report
        if: always()
        run: allure generate target/allure-results --clean -o target/allure-report

      - name: Check Swagger Quality Gate
        if: always()
        run: |
          COVERAGE=$(jq '.coverage' target/swagger-coverage-output/swagger-coverage-result.json)
          echo "============================================="
          echo "Текущее покрытие API по Swagger: $COVERAGE%"
          echo "============================================="
          if (( $(echo "$COVERAGE < 50" | bc -l) )); then
            echo "Ошибка: Quality Gate не пройден! Покрытие API ($COVERAGE%) ниже необходимых 50%."
            exit 1
          fi

      - name: Prepare Report Directory Structure
        if: always()
        run: |
          mkdir -p public/test-report/${{ github.run_number }}/allure-report
          mkdir -p public/test-report/${{ github.run_number }}/swagger-coverage
          cp -r target/allure-report/* public/test-report/${{ github.run_number }}/allure-report/
          if [ -f swagger-coverage-report.html ]; then
            cp swagger-coverage-report.html public/test-report/${{ github.run_number }}/swagger-coverage/index.html
          fi
          cp target/swagger-coverage-output/swagger-coverage-result.json public/test-report/${{ github.run_number }}/swagger-coverage/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          keep_files: true

      - name: Clean up services
        if: always()
        run: |
          cd infra/docker_compose
          docker compose down -v

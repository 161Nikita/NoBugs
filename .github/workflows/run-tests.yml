name: Run tests

# Триггер
on: [ push, workflow_dispatch ]

jobs: # аналог этапов
  run-tests:
    name: Set up services (review apps) and run tests # поднимаем сервис и запускаем
    runs-on: ubuntu-latest # на какой CI раннере хотим исполнять тесты
    steps: # шаги конкретной джобы
      - name: Checkout repository # копируем файлы репозитория внутри CI агента
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys:
            ${{ runner.os }}-maven-

      - name: Set up services
        run: bash infra/docker_compose/restart_docker.sh

      - name: Run tests
        run: ./mvnw clean test

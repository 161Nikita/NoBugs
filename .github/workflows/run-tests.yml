name: Build, Run Tests and Deploy Reports

on:
  push:
    paths:
      - 'src/**'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Run Automation Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'
          cache: 'maven'

      - name: Permission for tools
        run: |
          chmod +x mvnw

      # 1. Находим docker-compose и поднимаем инфраструктуру
      - name: Start Infrastructure via Docker Compose
        run: |
          COMPOSE_PATH=$(find . -name "docker-compose.yml" -print -quit)
          COMPOSE_DIR=$(dirname "$COMPOSE_PATH")
          cd "$COMPOSE_DIR"
          sed -i 's|nobugsme/nbank:preprod_version|nobugsme/nbank:with_validation_fix_with_swagger|g' docker-compose.yml
          docker compose up -d
          sleep 15

      # 1.5 Скачиваем и подготавливаем swagger-coverage-commandline 1.5.0
      - name: Download and Install Swagger Coverage CLI
        run: |
          wget https://github.com/viclovsky/swagger-coverage/releases/download/1.5.0/swagger-coverage-1.5.0.zip
          unzip swagger-coverage-1.5.0.zip
          mv swagger-coverage-1.5.0 .swagger-coverage-commandline
          chmod +x .swagger-coverage-commandline/bin/swagger-coverage-commandline

      # 2. 5 прогонов тестов на localhost
      - name: Run Tests 5 Times
        run: |
          for i in {1..5}; do
            echo "ЗАПУСК АВТОТЕСТОВ: ИТЕРАЦИЯ №$i"
            ./mvnw clean test -DbaseUrl=http://localhost:4111 -DuiUrl=http://localhost:3000 || true
          done

      # 3. Запуск Swagger Coverage CLI для генерации HTML и JSON результатов
      - name: Run Swagger coverage
        if: always()
        run: |
          if [ -d target/swagger-coverage-output ]; then
            .swagger-coverage-commandline/bin/swagger-coverage-commandline -s http://localhost:4111/v3/api-docs -i target/swagger-coverage-output || true
          else
            echo "Папка target/swagger-coverage-output пуста или не существует. Проверяем генерацию..."
          fi

      # 4. Скачиваем официальный стабильный Allure CLI
      - name: Install Allure CLI
        if: always()
        run: |
          sudo npm install -g allure-commandline --unsafe-perm=true
          allure --version

      # 5. Генерируем Allure Report
      - name: Generate Allure Report
        if: always()
        run: |
          if [ -d target/allure-results ]; then
            allure generate target/allure-results --clean -o target/allure-report || true
          elif [ -d .allure ]; then
            allure generate .allure --clean -o target/allure-report || true
          else
            echo "Папка с результатами Allure не найдена!"
          fi

      # 6. Настройка Quality Gate по Swagger
      - name: Check Swagger Quality Gate
        if: always()
        run: |
          if [ -f target/swagger-coverage-output/swagger-coverage-result.json ]; then
            COVERAGE=$(jq '.coverage' target/swagger-coverage-output/swagger-coverage-result.json)
            echo "Текущее покрытие API по Swagger: $COVERAGE%"
            if (( $(echo "$COVERAGE < 50" | bc -l) )); then
              echo "Ошибка: Покрытие API ($COVERAGE%) ниже необходимых 50%."
              exit 1
            fi
          else
            echo "Внимание: Файл swagger-coverage-result.json не найден, пропускаем gate."
          fi

      # 7. Раскладываем отчеты строго по папкам: test-report/{номер_пайплайна}/...
      - name: Prepare Report Directory Structure
        if: always()
        run: |
          # Создаем структуру под allure-report
          mkdir -p "public/test-report/${{ github.run_number }}/allure-report"
          
          # Копируем Allure Report
          if [ -d target/allure-report ]; then
            cp -r target/allure-report/* "public/test-report/${{ github.run_number }}/allure-report/"
          fi
          
          # Копируем HTML-отчет Swagger прямо в папку билда рядом с allure-report
          if [ -f swagger-coverage-report.html ]; then
            cp swagger-coverage-report.html "public/test-report/${{ github.run_number }}/swagger-coverage-report.html"
          elif [ -f target/swagger-coverage-report.html ]; then
            cp target/swagger-coverage-report.html "public/test-report/${{ github.run_number }}/swagger-coverage-report.html"
          else
            # Безопасный поиск: если папки target нет, find не уронит шаг с ошибкой благодаря проверке директории
            if [ -d target ]; then
              SWAGGER_HTML=$(find target -name "swagger-coverage-report.html" -print -quit)
              if [ -n "$SWAGGER_HTML" ] && [ -f "$SWAGGER_HTML" ]; then
                cp "$SWAGGER_HTML" "public/test-report/${{ github.run_number }}/swagger-coverage-report.html"
              else
                echo "Файл swagger-coverage-report.html не найден!"
              fi
            else
              echo "Директория target не существует, Swagger HTML скопировать невозможно."
            fi
          fi
          
          # Копируем JSON покрытия в ту же папку (полезно для отладки Quality Gate)
          if [ -f target/swagger-coverage-output/swagger-coverage-result.json ]; then
            cp target/swagger-coverage-output/swagger-coverage-result.json "public/test-report/${{ github.run_number }}/"
          fi

          # Создаем корневой редирект на Allure
          echo '<meta http-equiv="refresh" content="0; url=/NoBugs/test-report/'${{ github.run_number }}'/allure-report/index.html">' > public/index.html

      # 8. Публикация в GitHub Pages
      - name: Publish test report
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: public
          keep_files: true

      # 9. Гасим контейнеры
      - name: Clean up services
        if: always()
        run: |
          COMPOSE_PATH=$(find . -name "docker-compose.yml" -print -quit)
          COMPOSE_DIR=$(dirname "$COMPOSE_PATH")
          cd "$COMPOSE_DIR"
          docker compose down -v